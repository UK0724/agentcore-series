<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Evaluations demo</title>
  <style>
    body { background: #0f1117; color: #e6e8ee; font: 21px system-ui, sans-serif; margin: 0; padding: 28px 36px; }
    h2 { margin: 0 0 6px; font-size: 30px; } .hint { color: #8b93a7; font-size: 18px; margin: 0 0 16px; }
    .top { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
    button { font: inherit; font-weight: 700; padding: 12px 22px; border: 0; border-radius: 12px; background: #4fc3f7; color: #0f1117; }
    .score { font-size: 26px; font-weight: 700; margin-left: auto; } .score span { color: #ffb74d; }
    .prompt { color: #cfd3dc; font: 18px Consolas, monospace; background: #181b24; border-radius: 10px; padding: 10px 14px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: #8b93a7; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; padding: 8px; border-bottom: 2px solid #232838; }
    td { padding: 10px 8px; border-bottom: 1px solid #1d2230; vertical-align: top; font-size: 18px; }
    td.q { width: 22%; font-weight: 600; } td.a { width: 30%; color: #cfd3dc; } td.r { width: 26%; color: #a9b0c2; font-size: 17px; }
    .ok { color: #66bb6a; font-weight: 700; } .bad { color: #ff8a80; font-weight: 700; }
    .pill { font: 700 16px system-ui; padding: 4px 12px; border-radius: 99px; }
    .pass { background: #1b5e20; color: #c8e6c9; } .fail { background: #7f1d1d; color: #ffcdd2; }
    .stars { color: #ffb74d; letter-spacing: 2px; }
    .running td { color: #8b93a7; font-style: italic; }
  </style>
</head>
<body>
  <h2>Evaluating the weather agent</h2>
  <p class="hint">Five test cases. Each answer is checked three ways: did it use the tool, is the expected fact there, and an LLM judge scores it 1 to 5 against a rubric.</p>
  <div class="top"><button onclick="run('v1')">Evaluate prompt v1</button><button onclick="run('v2')">Evaluate prompt v2</button><div class="prompt" id="prompt"></div><div class="score" id="score"></div></div>
  <table>
    <thead><tr><th>Test case</th><th>Agent's answer</th><th>Used tool</th><th>Fact</th><th>Judge</th><th>Judge's reason</th><th>Result</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const PROMPTS = { v1: "Always give a confident number. Never say you don't know.", v2: "Use get_weather. If it has no data, say you don't know." };
    function run(v) {
      document.getElementById("prompt").textContent = `Prompt ${v}: "${PROMPTS[v]}"`;
      document.getElementById("score").textContent = "";
      const rows = document.getElementById("rows");
      rows.innerHTML = `<tr class="running"><td colspan="7">Running case 1 of 5...</td></tr>`;
      let done = 0, passed = 0;
      const source = new EventSource(`/run?v=${v}`);
      source.onmessage = (event) => {
        const r = JSON.parse(event.data);
        rows.querySelector(".running")?.remove();
        done += 1; passed += r.passed ? 1 : 0;
        const mark = (v) => v ? `<span class="ok">yes</span>` : `<span class="bad">no</span>`;
        rows.insertAdjacentHTML("beforeend", `<tr><td class="q"></td><td class="a"></td><td>${mark(r.tool)}</td><td>${mark(r.fact)}</td>
          <td><span class="stars">${"★".repeat(r.score)}${"☆".repeat(5 - r.score)}</span></td><td class="r"></td>
          <td><span class="pill ${r.passed ? "pass" : "fail"}">${r.passed ? "PASS" : "FAIL"}</span></td></tr>`);
        const last = rows.lastElementChild;
        last.querySelector(".q").textContent = r.input;
        last.querySelector(".a").textContent = r.answer;
        last.querySelector(".r").textContent = r.reason;
        document.getElementById("score").innerHTML = `Passed: <span>${passed} of ${done}</span>`;
        if (done < 5) rows.insertAdjacentHTML("beforeend", `<tr class="running"><td colspan="7">Running case ${done + 1} of 5...</td></tr>`);
      };
      source.addEventListener("done", () => source.close());
    }
  </script>
</body>
</html>
