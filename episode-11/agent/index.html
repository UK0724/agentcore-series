<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Payments toy</title>
  <style>
    body { background: #0f1117; color: #e6e8ee; font: 22px system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
    .left { width: 36%; padding: 32px; border-right: 2px solid #232838; display: flex; flex-direction: column; gap: 18px; }
    .right { flex: 1; padding: 32px; overflow: auto; }
    h2 { margin: 0 0 6px; font-size: 28px; } .hint { color: #8b93a7; font-size: 18px; margin: 0 0 14px; }
    .banner { background: #3a2a00; color: #ffe0a3; border-radius: 12px; padding: 12px 16px; font-size: 19px; }
    .budget { background: #181b24; border-radius: 14px; padding: 16px; }
    .bar { height: 22px; background: #232838; border-radius: 99px; overflow: hidden; margin-top: 10px; }
    .fill { height: 100%; width: 0; background: #66bb6a; transition: width .4s; }
    button { font: inherit; font-weight: 700; padding: 14px; border: 0; border-radius: 12px; background: #4fc3f7; color: #0f1117; }
    .round { color: #8b93a7; font-size: 18px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
    .card { background: #181b24; border-radius: 14px; padding: 12px 18px; margin-bottom: 10px; border-left: 8px solid; }
    .ask { border-color: #ffb74d; } .ask .who { color: #ffb74d; } .pay { border-color: #b388ff; } .pay .who { color: #b388ff; }
    .done { border-color: #66bb6a; } .done .who { color: #66bb6a; } .deny { border-color: #ff8a80; } .deny .who { color: #ff8a80; }
    .who { font-size: 16px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .title { font-size: 21px; margin: 4px 0 6px; }
    pre { margin: 0; font: 18px Consolas, monospace; color: #cfd3dc; white-space: pre-wrap; }
  </style>
</head>
<body>
  <section class="left">
    <h2>Weather agent</h2>
    <div class="banner">A toy simulation. Pretend cents only: no wallet, no real money.</div>
    <div class="budget"><b>Payment session</b><div id="spent">Spent 0 of 5 pretend cents</div><div class="bar"><div class="fill" id="fill"></div></div></div>
    <button onclick="buy()">Get the weather report (2 cents)</button>
  </section>
  <section class="right">
    <h2>What happened, step by step</h2>
    <p class="hint">Orange: the API asks for payment (402). Purple: the session pays. Green: the paid answer. Red: refused.</p>
    <div id="steps"></div>
  </section>
  <script>
    const WHO = { ask: "Paid API", pay: "Payment session", done: "Paid API", deny: "Payment session" };
    let round = 0;
    async function buy() {
      const cards = await (await fetch("/buy")).json();
      const steps = document.getElementById("steps");
      steps.insertAdjacentHTML("beforeend", `<div class="round">Request ${++round}</div>`);
      for (const { who, title, data } of cards) {
        const card = document.createElement("div");
        card.className = `card ${who}`;
        card.innerHTML = `<div class="who">${WHO[who]}</div><div class="title"></div><pre></pre>`;
        card.querySelector(".title").textContent = title;
        card.querySelector("pre").textContent = typeof data === "string" ? data : JSON.stringify(data, null, 1);
        steps.append(card);
        if (data && data.spent !== undefined) {
          document.getElementById("spent").textContent = `Spent ${data.spent} of ${data.limit} pretend cents`;
          document.getElementById("fill").style.width = `${(100 * data.spent) / data.limit}%`;
        }
        steps.scrollTop = steps.scrollHeight;
        await new Promise((r) => setTimeout(r, 900));
      }
      document.querySelector(".right").scrollTop = 1e6;
    }
  </script>
</body>
</html>
